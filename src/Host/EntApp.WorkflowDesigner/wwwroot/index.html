<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EntApp — Workflow Designer</title>
    <base href="/" />

    <!-- Elsa Studio Shell -->
    <link rel="icon" type="image/png" sizes="32x32" href="_content/Elsa.Studio.Shell/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="_content/Elsa.Studio.Shell/favicon-16x16.png">
    <link href="_content/Elsa.Studio.Shell/css/shell.css" rel="stylesheet">

    <!-- MudBlazor + Extensions -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.css" rel="stylesheet" />

    <!-- Radzen (Elsa diagram bileşenleri) -->
    <link href="_content/Radzen.Blazor/css/material-base.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; color: #64748b;">
            <div style="text-align: center;">
                <div style="width: 48px; height: 48px; border: 3px solid #e2e8f0; border-top-color: #0d9488; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                <p>Workflow Designer yükleniyor...</p>
            </div>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>

    <div id="blazor-error-ui" style="display: none; background: #fee2e2; color: #991b1b; padding: 16px; position: fixed; bottom: 0; width: 100%; text-align: center; z-index: 1000;">
        An unhandled error has occurred.
        <a href="" class="reload" style="color: #991b1b; text-decoration: underline;">Reload</a>
        <a class="dismiss" style="cursor:pointer; margin-left:8px;">🗙</a>
    </div>

    <!-- BlazorMonaco — Expression/Code editor -->
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>

    <!-- MudBlazor + CodeBeam Extensions -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.js"></script>

    <!-- Radzen — diagram/chart components -->
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>

    <!-- Auth interop (Blazor WASM Auth) -->
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>

    <!-- Blazor WASM runtime (must be last) -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
